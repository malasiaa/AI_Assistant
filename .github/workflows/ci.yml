name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Only the light test dependencies are installed here. The full runtime
    # stack (torch, whisper, FAISS) is too heavy for a unit-test job.
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Check that all Python files compile
      run: python -m compileall -q app tests

    - name: Run tests
      run: pytest
